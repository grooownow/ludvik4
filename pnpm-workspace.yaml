allowBuilds:
  # Downloads a native sentry-cli binary used for source-map upload — this
  # slot deliberately doesn't do source-map upload (see next.config.ts), so
  # the binary is never invoked; denying its postinstall keeps that decision
  # consistent and shrinks the install footprint.
  "@sentry/cli": false
  # Transitive dep of posthog-js; postinstall only prints a sponsor message.
  core-js: false
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
auditConfig:
  # GHSA-jmr9-qjv8-65gv: extract-zip symlink path traversal. The advisory has
  # no patched npm release. It is reachable only through the dev-only
  # Lighthouse stack; this project does not pass untrusted archives to it.
  # Remove once Lighthouse moves to @puppeteer/browsers 3.x (which dropped
  # extract-zip) or extract-zip publishes a fixed version.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    # GHSA-7pqw-9j4j-h8q3: a second extract-zip symlink-write advisory with
    # the same dev-only reachability and no patched npm release (2.0.1 is
    # still latest). Remove alongside the exception above once the parent
    # dependency drops extract-zip or a fixed version is published.
    - GHSA-7pqw-9j4j-h8q3
    # GHSA-vfj7-8cjw-p6xm: braces stack exhaustion on deeply nested globs.
    # npm's latest is still 3.0.3 (no patched release). All five paths are
    # dev-only lint/shadcn tooling using repository-controlled glob patterns;
    # src/ has no braces/micromatch entry point or request-supplied patterns.
    # Remove when braces publishes a patched release or parents replace it.
    - GHSA-vfj7-8cjw-p6xm
    # GHSA-mrhx-c7xc-m3w5: zod memory exhaustion on oversized constrained
    # collections, fixed in 4.6.6. The app's own zod is pinned to ^4.6.7 in
    # package.json; this exception covers only the zod 3.25.x copy that
    # chromium-bidi pulls in under the dev-only Lighthouse CI stack (@lhci/cli
    # > lighthouse > puppeteer-core), which validates no visitor input and has
    # no patched 3.x release. Remove when chromium-bidi moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
overrides:
  # GHSA-8r5x-fm3f-whwj + GHSA-p8wg-vrv2-v86f: AST injection. The latest
  # eslint-plugin-boundaries 7.2.0 pins 4.7.9; 4.7.10 preserves the 4.x API.
  # Remove when that plugin and @boundaries/elements ship a patched range.
  handlebars@<=4.7.9: ^4.7.10
  # GHSA-c475-qrg2-pj4r: FTP directory-listing DoS (dev-only LHCI proxy chain).
  # Even get-uri 8.0.1 still requests basic-ftp 5.x. Version 6 retains the
  # Client API; its breaking change rejects separate transfer hosts by default,
  # a secure restriction not needed by this project's HTTP-only Lighthouse run.
  # Remove when get-uri's range reaches a patched version.
  "get-uri>basic-ftp": ^6.2.3
  # GHSA-ph9p-34f9-6g65: tmp path traversal via @lhci/cli (dev-only).
  # Remove when @lhci/cli or its transitive deps (inquirer, external-editor) update.
  tmp@<0.2.6: ^0.2.6
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g: browserslist memory growth
  # and prototype-write issues (via @sentry/webpack-plugin > webpack).
  browserslist@<=4.28.6: ^4.28.7
  # GHSA-67mh-4wv8-2f99: esbuild dev-server request exposure through the
  # legacy @esbuild-kit loader bundled by the latest drizzle-kit.
  esbuild@<=0.24.2: ^0.25.0
  # GHSA-w5hq-g745-h8pq: uuid buffer bounds issue in the latest @lhci/cli.
  # LHCI only calls UUID generation during local/CI Lighthouse collection.
  uuid@<11.1.1: ^11.1.1
  # The entries below pull transitive copies up to their patched versions. Each
  # is reachable only through a dependency that has not re-released yet
  # (next, @sentry/nextjs, eslint, shadcn), so a direct bump cannot fix them.
  # Drop an entry once its parent ships the patched range on its own.
  # GHSA-f88m-g3jw-g9cj: sharp — libvips buffer overflow (via next).
  sharp@<0.35.0: ^0.35.3
  # GHSA-6g55-p6wh-862q + GHSA-r28c-9q8g-f849: postcss parsing issues
  # (transitive copies via next and @sentry/nextjs).
  postcss@<8.5.18: ^8.5.23
  # GHSA-v2hh-gcrm-f6hx: fast-uri host confusion via a backslash authority
  # delimiter (via @sentry/nextjs > ajv, and shadcn).
  fast-uri@<3.1.4: ^3.1.4
  # GHSA-mh99-v99m-4gvg: brace-expansion ReDoS (via eslint and @sentry/nextjs).
  brace-expansion@<5.0.8: ^5.0.8
  # GHSA-7rqj-j65f-68wh (homoglyph @ bypass in the email normalizer) and
  # GHSA-xmf8-cvqr-rfgj (getToken() throws on a malformed Bearer header).
  # The direct dependency is already on 0.41.3; this pulls up the copy that
  # @auth/drizzle-adapter still pins.
  "@auth/core@<0.41.3": ^0.41.3
  # GHSA-27r3-jxmh-p828: body-parser DoS via trailing bytes after a compressed
  # body. Both copies are dev-only: 1.x under @lhci/cli > express and 2.x under
  # @modelcontextprotocol/sdk. Drop once those parents ship the patched range.
  body-parser@<1.20.9: ^1.20.9
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  # GHSA-xjj6-f33q-929c: undici, fixed in 7.30.1. Both copies are dev-only
  # (the direct devDependency and shadcn's). Drop once both are on >=7.30.1.
  "undici@>=7.18.0 <7.30.1": ^7.30.1
