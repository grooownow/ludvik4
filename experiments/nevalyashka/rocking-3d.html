<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Jelly — a little balance study</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --paper: #fcf9f6;
        --ink: #36212e;
        --muted: #796671;
        --pink: #d80e66;
        --line: #e8dce2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(1080px, 100%);
        margin: auto;
        padding: 32px 32px 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .wordmark {
        font-size: 20px;
        letter-spacing: -0.9px;
        font-weight: 650;
      }
      .dot {
        color: var(--pink);
      }
      .caption {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 40px);
        font-weight: 450;
        letter-spacing: -1.8px;
      }
      .stage {
        position: relative;
        width: min(680px, 100%);
        margin: 8px auto 0;
        aspect-ratio: 1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
        border-radius: 20px;
      }
      canvas:active {
        cursor: grabbing;
      }
      canvas:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 4px;
      }
      .hint {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 22px;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      button {
        font: inherit;
        cursor: pointer;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 10px 18px;
        color: var(--ink);
        transition: background 0.15s;
      }
      button:hover {
        background: #f3e8ee;
      }
      button.primary {
        background: var(--ink);
        color: white;
        border-color: var(--ink);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 4px;
      }
      .setting {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        padding: 10px 16px;
        border-radius: 30px;
        font-size: 12px;
        color: var(--muted);
      }
      input {
        width: 90px;
        accent-color: var(--pink);
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 32px 0 0;
        color: var(--muted);
        font-size: 11px;
      }
      .error {
        position: absolute;
        inset: 15%;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .error[hidden] {
        display: none;
      }
      @media (max-width: 600px) {
        main {
          padding: 22px 16px;
        }
        .caption {
          font-size: 9px;
          letter-spacing: 1px;
        }
        header {
          align-items: flex-start;
        }
        .stage {
          margin: 12px auto 0;
        }
        .hint {
          font-size: 11px;
        }
        .controls {
          gap: 8px;
        }
        button {
          padding: 10px 14px;
        }
        .setting {
          width: 100%;
          justify-content: center;
        }
        footer {
          margin-top: 24px;
        }
        .footer-note {
          max-width: 180px;
          text-align: right;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="wordmark">ludvik4<span class="dot">.</span></div>
          <h1>A little balance.</h1>
        </div>
        <div class="caption">Jelly / motion study 03</div>
      </header>
      <div class="stage">
        <canvas
          id="scene"
          tabindex="0"
          role="img"
          aria-label="Interactive three-dimensional pink jelly roly-poly. Drag to orbit; use arrow keys or the Nudge button to make it rock."
        ></canvas>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
      <p class="hint">Drag to explore · click to nudge · arrow keys to rock</p>
      <div class="controls" aria-label="Animation controls">
        <button class="primary" id="pause" aria-pressed="false">Pause</button>
        <button id="nudge">Nudge ↗</button>
        <button id="reset">Reset view</button>
        <label class="setting"
          >Rocking
          <input
            id="amplitude"
            type="range"
            min="0"
            max="0.36"
            step="0.01"
            value="0.16"
            aria-label="Rocking amplitude"
        /></label>
        <button id="save">Save PNG</button>
      </div>
      <footer>
        <span>Rounder. Softer. A little wobbly.</span
        ><span class="footer-note"
          >Drag all the way around to see the volume.</span
        >
      </footer>
    </main>
    <script id="fs" type="x-shader/x-fragment">
      precision highp float;
      uniform vec2 uRes;
      uniform vec3 uColor;
      uniform vec3 uShape;
      uniform vec2 uTilt;
      uniform vec2 uLag;
      uniform vec2 uCam;
      uniform float uTransparent;
      uniform float uSurprise;

      const vec3 BG = vec3(0.985,0.975,0.965);
      mat3 toLocal;
      vec3 bodyPos;
      vec3 lightDir;

      mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.0,0.0,0.0,0.0,c,s,0.0,-s,c);}
      mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.0,-s,c,0.0,0.0,0.0,1.0);}
      float smin(float a,float b,float k){float h=max(k-abs(a-b),0.0)/k;return min(a,b)-h*h*k*0.25;}
      float smax(float a,float b,float k){return -smin(-a,-b,k);}
      float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}

      float model(vec3 q){
        float hy=uShape.x,hr=uShape.y,k=uShape.z;
        vec3 lag=vec3(uLag.x,0.0,uLag.y);
        vec3 hc=vec3(0.0,hy,0.0)+lag*0.6;
        float d=smin(length((q-vec3(0.0,1.0,0.0))/vec3(1.10,1.0,1.04))-1.0,length(q-hc)-hr,k);
        float es=hr/0.66;
        float s=uSurprise;
        vec2 e=vec2(abs(q.x-hc.x),q.y)-vec2(0.25*es,hy+(0.04+0.03*s)*es);
        d=smax(d,-(length(e)-(0.157*es*(1.0+0.08*s)+0.10*abs(q.z))),0.05);
        d=smax(d,-(length(q.xy-vec2(0.0,0.98))-(0.265+0.12*abs(q.z))),0.075);
        vec3 top=vec3(0.0,hy+hr,0.0);
        vec3 tip=top+vec3(0.0,0.4+0.18*s,0.0)+lag*1.6;
        float ant=min(sdCap(q,top-vec3(0.0,0.15,0.0)+lag*0.6,tip-vec3(0.0,0.12,0.0),0.065),length(q-tip)-0.15);
        d=smin(d,ant,0.08);
        vec3 a=vec3(abs(q.x),q.y,q.z);
        float arm=sdCap(a,vec3(0.8,1.22,0.0),vec3(1.42,1.22,0.0),0.075);
        vec3 h=a-vec3(1.6,1.22,0.0);
        float ring=length(vec2(length(h.xy)-0.16,h.z))-0.085;
        return smin(d,smin(arm,ring,0.05),0.12);
      }
      float map(vec3 p){return model(toLocal*(p-bodyPos)+vec3(0.0,1.0,0.0));}
      vec3 normalAt(vec3 p){
        vec2 e=vec2(0.0015,-0.0015);
        return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx));
      }
      vec3 studio(vec3 r,float keyScale){
        vec3 col=vec3(mix(0.78,1.0,r.y*0.5+0.5));
        float ang=acos(clamp(dot(r,lightDir),-1.0,1.0));
        col+=vec3(1.0,0.99,0.97)*keyScale*(10.0*exp(-pow(ang,2.0))+34.0*exp(-pow(ang/0.3,2.0)));
        vec3 fillDir=normalize(vec3(-lightDir.x,0.35,0.8));
        col+=vec3(0.5)*exp(-pow(acos(clamp(dot(r,fillDir),-1.0,1.0))/0.5,2.0));
        return col;
      }
      vec3 absorbCoef(){vec3 tint=clamp(uColor,vec3(0.02),vec3(0.995));return -log(tint)/0.9;}
      vec3 floorShade(vec3 fp){
        vec3 absorb=absorbCoef();
        float through=0.0,s=0.0;
        for(int i=0;i<40;i++){
          s+=0.09;
          float pen=max(0.02,0.35*s);
          through+=clamp(0.5-map(fp+lightDir*s)/pen,0.0,1.0)*0.09;
        }
        vec3 sh=exp(-absorb*through*0.9)*(1.0-0.3*clamp(through/0.9,0.0,1.0));
        float ao=0.55+0.45*smoothstep(0.0,0.6,map(fp));
        return mix(vec3(1.0),sh*ao,0.7);
      }

      void main(){
        float a=uTilt.x,b=uTilt.y;
        toLocal=rotX(-b)*rotZ(-a);
        bodyPos=vec3(-a,1.0,b);
        float az=radians(10.0),el=radians(62.0);
        lightDir=normalize(vec3(sin(az)*cos(el),sin(el),cos(az)*cos(el)));

        float side=min(uRes.x,uRes.y);
        vec2 uv=(gl_FragCoord.xy-uRes*0.5)/side;
        vec3 target=vec3(0.0,1.55,0.0);
        float yaw=uCam.x,pitch=uCam.y;
        vec3 ro=target+7.5*vec3(sin(yaw)*cos(pitch),sin(pitch),cos(yaw)*cos(pitch));
        vec3 fwd=normalize(target-ro);
        vec3 right=normalize(cross(fwd,vec3(0.0,1.0,0.0)));
        vec3 up=cross(right,fwd);
        vec3 rd=normalize(fwd*1.58+right*uv.x+up*uv.y);

        float tFloor=rd.y<0.0?-ro.y/rd.y:1e5;
        float tMax=min(tFloor,20.0);
        float t=3.0,d=1.0;
        for(int i=0;i<120;i++){
          d=map(ro+rd*t);
          if(d<0.0008*t||t>tMax)break;
          t+=d;
        }
        vec3 p1=ro+rd*t;
        float eps=0.0012*t;
        float hit=(1.0-smoothstep(eps,eps*2.5,map(p1)))*step(t,tMax);

        vec4 objOut=vec4(0.0);
        if(hit>0.0){
          vec3 n1=normalAt(p1);
          p1-=n1*map(p1);
          p1-=n1*map(p1);
          vec3 tint=clamp(uColor,vec3(0.02),vec3(0.995));
          float cosine=max(dot(n1,-rd),0.0);
          float edge=pow(1.0-cosine,3.0);
          float diffuse=dot(n1,lightDir)*0.5+0.5;
          vec3 base=pow(tint,vec3(0.68));
          vec3 col=base*(0.86+0.25*diffuse);
          col=mix(col,vec3(1.0,0.025,0.72),0.24*edge);
          vec3 halfKey=normalize(lightDir-rd);
          float key=pow(max(dot(n1,halfKey),0.0),95.0);
          float bloom=pow(max(dot(n1,halfKey),0.0),14.0);
          vec3 fillLight=normalize(vec3(-0.85,0.5,0.8));
          float fill=pow(max(dot(n1,normalize(fillLight-rd)),0.0),55.0);
          col+=vec3(1.0,0.92,0.99)*(key*1.6+bloom*0.13+fill*0.48);
          col+=vec3(0.38,0.1,0.35)*edge*0.55;
          col+=studio(reflect(rd,n1),0.12)*0.023;
          float ao=1.0;
          for(int j=1;j<=4;j++){
            float reach=float(j)*0.09;
            ao-=(reach-map(p1+n1*reach))*0.4;
          }
          col*=clamp(ao,0.65,1.0);
          objOut=vec4(clamp(col,0.0,1.0),1.0);
        }

        vec4 bgOut=vec4(0.0);
        if(hit<1.0){
          vec3 shade=vec3(1.0);
          if(rd.y<0.0){
            vec3 fp=ro+rd*tFloor;
            shade=floorShade(fp);
          }
          float m=min(shade.r,min(shade.g,shade.b));
          bgOut=vec4(BG*(shade-m),1.0-m);
          if(uTransparent<0.5)bgOut=vec4(bgOut.rgb+BG*(1.0-bgOut.a),1.0);
        }
        gl_FragColor=mix(bgOut,objOut,hit);
      }
    </script>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const canvas = $("scene");
        const error = $("error");
        function fail(message) {
          error.textContent = message;
          error.hidden = false;
        }
        const gl = canvas.getContext("webgl", {
          alpha: false,
          antialias: false,
          preserveDrawingBuffer: true,
        });
        if (!gl) {
          fail(
            "This browser could not start 3D. Please try a browser with WebGL enabled.",
          );
          return;
        }
        function compile(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw new Error(gl.getShaderInfoLog(shader));
          return shader;
        }
        let program;
        try {
          program = gl.createProgram();
          gl.attachShader(
            program,
            compile(
              gl.VERTEX_SHADER,
              "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}",
            ),
          );
          gl.attachShader(
            program,
            compile(gl.FRAGMENT_SHADER, $("fs").textContent),
          );
          gl.bindAttribLocation(program, 0, "p");
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS))
            throw new Error(gl.getProgramInfoLog(program));
        } catch (err) {
          console.error(err);
          fail("The 3D scene could not load. Please try another browser.");
          return;
        }
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        const U = Object.fromEntries(
          [
            "uRes",
            "uColor",
            "uShape",
            "uTilt",
            "uLag",
            "uCam",
            "uTransparent",
            "uSurprise",
          ].map((n) => [n, gl.getUniformLocation(program, n)]),
        );
        const reduced = matchMedia("(prefers-reduced-motion: reduce)");
        let paused = reduced.matches;
        let yaw = -0.24,
          pitch = 0.12,
          time = 0,
          last = 0,
          frameCount = 0;
        const spring = { a: 0, b: 0, va: 0, vb: 0 };
        const lag = { x: 0, z: 0 };
        let tilt = [0, 0];
        let dirty = true;
        function pauseUI() {
          $("pause").textContent = paused ? "Play" : "Pause";
          $("pause").setAttribute("aria-pressed", String(paused));
        }
        pauseUI();
        function resize() {
          const rect = canvas.getBoundingClientRect();
          const dpr = Math.min(
            devicePixelRatio || 1,
            1.35,
            960 / Math.max(rect.width, rect.height),
          );
          canvas.width = Math.max(1, Math.round(rect.width * dpr));
          canvas.height = Math.max(1, Math.round(rect.height * dpr));
          dirty = true;
        }
        new ResizeObserver(resize).observe(canvas);
        function nudge(x = 1, z = 0.5) {
          if (paused) {
            paused = false;
            pauseUI();
          }
          spring.va += x * 1.5;
          spring.vb += z * 1.4;
          dirty = true;
        }
        $("pause").onclick = () => {
          paused = !paused;
          pauseUI();
          dirty = true;
        };
        $("nudge").onclick = () => nudge(Math.cos(yaw), Math.sin(yaw) + 0.4);
        $("amplitude").oninput = () => {
          dirty = true;
        };
        $("reset").onclick = () => {
          yaw = -0.24;
          pitch = 0.12;
          time = 0;
          Object.assign(spring, { a: 0, b: 0, va: 0, vb: 0 });
          Object.assign(lag, { x: 0, z: 0 });
          tilt = [0, 0];
          dirty = true;
        };
        reduced.addEventListener("change", (e) => {
          if (e.matches) {
            paused = true;
            pauseUI();
            dirty = true;
          }
        });
        let drag;
        canvas.addEventListener("pointerdown", (e) => {
          drag = { x: e.clientX, y: e.clientY, moved: 0 };
          canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const dx = e.clientX - drag.x,
            dy = e.clientY - drag.y;
          drag.moved += Math.abs(dx) + Math.abs(dy);
          yaw -= dx * 0.007;
          pitch = Math.max(-0.04, Math.min(0.8, pitch + dy * 0.004));
          drag.x = e.clientX;
          drag.y = e.clientY;
          dirty = true;
        });
        canvas.addEventListener("pointerup", (e) => {
          if (drag && drag.moved < 5) {
            const r = canvas.getBoundingClientRect();
            const side = (e.clientX - r.left) / r.width < 0.5 ? 1 : -1;
            nudge(side * Math.cos(yaw), -side * Math.sin(yaw) + 0.35);
          }
          drag = null;
        });
        canvas.addEventListener("pointercancel", () => {
          drag = null;
        });
        canvas.addEventListener("lostpointercapture", () => {
          drag = null;
        });
        canvas.addEventListener("keydown", (e) => {
          const directions = {
            ArrowLeft: [-1, 0],
            ArrowRight: [1, 0],
            ArrowUp: [0, -1],
            ArrowDown: [0, 1],
          };
          if (directions[e.key]) {
            e.preventDefault();
            nudge(...directions[e.key]);
          }
        });
        canvas.addEventListener("webglcontextlost", (e) => {
          e.preventDefault();
          fail("The 3D context was interrupted. Reload to restart the scene.");
        });
        function advance(dt) {
          const steps = Math.max(1, Math.ceil(dt * 120)),
            h = dt / steps;
          for (let i = 0; i < steps; i++) {
            spring.va += (-15 * spring.a - 1.8 * spring.va) * h;
            spring.vb += (-13 * spring.b - 1.7 * spring.vb) * h;
            spring.a += spring.va * h;
            spring.b += spring.vb * h;
          }
          time += dt;
          const amp = Number($("amplitude").value);
          const a = Math.max(
            -0.44,
            Math.min(
              0.44,
              spring.a +
                amp *
                  Math.sin(time * 2.1) *
                  (0.82 + 0.18 * Math.cos(time * 0.37)),
            ),
          );
          const b = Math.max(
            -0.4,
            Math.min(0.4, spring.b + amp * 0.55 * Math.sin(time * 1.57)),
          );
          const ease = 1 - Math.exp(-dt * 8);
          lag.x += ((a - tilt[0]) * 0.75 - lag.x) * ease;
          lag.z += ((tilt[1] - b) * 0.75 - lag.z) * ease;
          tilt = [a, b];
        }
        function render() {
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(U.uRes, canvas.width, canvas.height);
          gl.uniform3f(U.uColor, 216 / 255, 14 / 255, 102 / 255);
          gl.uniform3f(U.uShape, 2.26, 0.67, 0.18);
          gl.uniform2f(U.uTilt, ...tilt);
          gl.uniform2f(U.uLag, lag.x, lag.z);
          gl.uniform2f(U.uCam, yaw, pitch);
          gl.uniform1f(U.uSurprise, 0);
          gl.uniform1f(U.uTransparent, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          frameCount++;
          canvas.dataset.ready = "true";
          canvas.dataset.frames = String(frameCount);
        }
        function frame(now) {
          const dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
          last = now;
          if (!document.hidden && !gl.isContextLost()) {
            if (!paused) advance(dt);
            if (!paused || dirty) {
              render();
              dirty = false;
            }
          }
          requestAnimationFrame(frame);
        }
        $("save").onclick = () => {
          render();
          canvas.toBlob((blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.download = "jelly-roly-poly-3d.png";
            a.href = url;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }, "image/png");
        };
        resize();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
