<!doctype html>
<!--
  Throwaway brainstorming mockup: first screen of the home on a phone
  (variant A). Not linked from the site; remove before merging into main
  (docs/specs/immersive-home.md → Handoff).
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Мобильный первый экран</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --stage: #ffe0fa;
        --ink: #1a1a1a;
        --muted: rgba(42, 20, 32, 0.7);
        --plum: #14040c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        overflow-x: clip;
      }
      body {
        background: var(--stage);
        font-family: "Geist", system-ui, sans-serif;
        color: var(--ink);
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      /* The phone's first screen. On a desktop it is framed as a 390×812 phone. */
      .screen {
        position: relative;
        width: 100%;
        height: 100svh;
        overflow: clip;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        background: radial-gradient(
          120% 70% at 50% 42%,
          #fff3fd 0%,
          var(--stage) 55%,
          #f9c9ea 100%
        );
      }
      @media (min-width: 700px) {
        body {
          background: var(--plum);
          display: grid;
          place-items: center;
          min-height: 100vh;
        }
        .screen {
          width: 390px;
          height: 812px;
          border-radius: 36px;
        }
      }
      .header {
        position: absolute;
        inset: 0 0 auto 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        font-weight: 600;
        font-size: 16px;
        z-index: 3;
      }
      .burger {
        width: 22px;
        height: 14px;
        border-top: 1.5px solid var(--ink);
        border-bottom: 1.5px solid var(--ink);
        position: relative;
      }
      .burger::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1.5px solid var(--ink);
        transform: translateY(-50%);
      }
      /* The mascot layer is a full 1:2.4 frame with the mascot at its centre;
         --k scales it by the screen width, --x/--y place its centre. The
         script rocks it about its belly (54% down the frame) and rolls it. */
      .mascot {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: calc(var(--k) * 100%);
        transform: translate(-50%, -50%);
        transform-origin: 50% 54%;
        z-index: 1;
        pointer-events: none;
        will-change: transform;
      }
      .mascot img {
        width: 100%;
        display: block;
        transform-origin: 50% 54%;
        animation: rock 3.2s ease-in-out infinite;
      }
      @keyframes rock {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(4deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mascot img {
          animation: none;
        }
      }
      .shadow {
        position: absolute;
        left: var(--x);
        top: calc(var(--y) + var(--k) * 26vw);
        width: calc(var(--k) * 46%);
        height: calc(var(--k) * 5%);
        transform: translate(-46%, -50%);
        background: radial-gradient(
          closest-side,
          rgba(214, 40, 130, 0.35),
          transparent
        );
        filter: blur(6px);
        z-index: 0;
      }
      @media (min-width: 700px) {
        .shadow {
          top: calc(var(--y) + var(--k) * 101px);
        }
      }
      .label {
        position: absolute;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        width: 270px;
        z-index: 2;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 10px;
        padding: 13px 16px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
      }
      .label .eyebrow {
        font-size: 11px;
      }
      .label b {
        display: block;
        color: var(--ink);
        opacity: 0.85;
        font-size: 15px;
        font-weight: 600;
        margin: 3px 0 5px;
      }
      .strip {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: max(22px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10.5px;
        color: var(--muted);
        z-index: 2;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #1db954;
        margin-right: 8px;
        vertical-align: middle;
      }
      .arrow {
        font-size: 20px;
        opacity: 0.35;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div class="screen" style="--k: 1.38; --y: 43%; --x: 53%">
      <div class="header"><span>Ludvik4</span><span class="burger"></span></div>
      <div class="shadow"></div>
      <div class="mascot">
        <img src="/stage/stage-mascot-tall-1560.webp" alt="" />
      </div>
      <div class="label">
        <span class="mono eyebrow">Экспонат № 04</span>
        <b>Ludvik</b>
        Чистый код, WebGL, ноль полигонов.
      </div>
      <div class="strip mono">
        <span><i class="dot"></i>Беру проекты · IV кв. 2026</span>
        <span class="arrow">↓</span>
      </div>
    </div>
    <script>
      // Tap = a hit. A damped spring like the site's (exhibit-physics.ts), with
      // the calmer phone values from the spec (w 2.6, zeta 0.25): each tap adds
      // speed, so taps in a row build up the swing instead of restarting it.
      // The roly-poly rolls on its round bottom as it tips, and may swing past
      // the screen edges.
      const W = 2.6;
      const ZETA = 0.25;
      const KICK = 2.6; // rad/s for a full hit, as on the desktop
      // The hit lands on release; its strength grows with how long the finger
      // rested: a flick gives a nudge, a short press a full swing.
      const FLICK_MS = 80;
      const PRESS_MS = 350;
      const FLICK_SHARE = 0.4;
      const SLOP_PX = 12; // a finger that travels further is scrolling, not hitting
      const MAX = 0.5; // rad, as on the desktop
      const ROLL = 0.175; // belly radius, in units of the mascot frame width

      const screen = document.querySelector(".screen");
      const mascot = document.querySelector(".mascot");
      let angle = 0;
      let speed = 0;
      let last = 0;
      let running = false;

      function frame(now) {
        const dt = Math.min(Math.max((now - last) / 1000, 0), 1 / 30);
        last = now;
        speed += (-W * W * angle - 2 * ZETA * W * speed) * dt;
        angle += speed * dt;
        const tilt = Math.max(-MAX, Math.min(MAX, angle));
        const roll = tilt * ROLL * mascot.offsetWidth;
        mascot.style.transform = `translate(calc(-50% + ${roll}px), -50%) rotate(${tilt}rad)`;
        if (Math.abs(angle) < 1e-3 && Math.abs(speed) < 1e-3) {
          running = false;
          mascot.style.transform = "";
          return;
        }
        requestAnimationFrame(frame);
      }

      let press = null;

      screen.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".label, .header, .strip")) return;
        const box = mascot.getBoundingClientRect();
        press = {
          t: performance.now(),
          x: event.clientX,
          y: event.clientY,
          // Hit on the left tips it to the right (clockwise), and back.
          side: event.clientX < box.left + box.width / 2 ? 1 : -1,
        };
      });

      screen.addEventListener("pointerup", (event) => {
        if (!press) return;
        const moved = Math.hypot(
          event.clientX - press.x,
          event.clientY - press.y,
        );
        const held = performance.now() - press.t;
        const side = press.side;
        press = null;
        if (moved > SLOP_PX) return;
        const k = Math.min(
          Math.max((held - FLICK_MS) / (PRESS_MS - FLICK_MS), 0),
          1,
        );
        speed += side * KICK * (FLICK_SHARE + (1 - FLICK_SHARE) * k);
        if (!running) {
          running = true;
          last = performance.now();
          requestAnimationFrame(frame);
        }
      });

      screen.addEventListener("pointercancel", () => {
        press = null;
      });
    </script>
  </body>
</html>
